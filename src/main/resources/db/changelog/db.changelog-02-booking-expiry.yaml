databaseChangeLog:
  - changeSet:
      id: 2-add-expired-at-to-bookings
      author: ant-gravity
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: bookings
                columnName: expired_at
      changes:
        - addColumn:
            tableName: bookings
            columns:
              - column:
                  name: expired_at
                  type: datetime
                  remarks: "Thời hạn thanh toán giữ chỗ (mặc định 2 tiếng cho PENDING_PAYMENT)"
