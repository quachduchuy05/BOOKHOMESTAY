# ============================================================
# NAP FILE .ENV (Ho tro ca khi chay tu thu muc goc hoac BookHomeStay)
# ============================================================
spring.config.import=optional:file:.env[.properties],optional:file:BOOKHOMESTAY/.env[.properties],optional:file:BookHomeStay/.env[.properties],optional:file:../.env[.properties]

# ============================================================
# CAU HINH DATABASE (Doc tu .env hoac dung gia tri mac dinh neu chua co)
# ============================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/homestay_booking_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Huutuyen123@}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Tắt cache Thymeleaf để khi sửa HTML chỉ cần F5 là thấy ngay
spring.thymeleaf.cache=false

# ============================================================
# LIQUIBASE
# ============================================================
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# ============================================================
# TASK 12 - VIETQR: Thong tin tai khoan ngan hang sinh ma QR (Doc tu .env)
# ============================================================
vietqr.bank-bin=${VIETQR_BANK_BIN}
vietqr.account-no=${VIETQR_ACCOUNT_NO}
vietqr.account-name=${VIETQR_ACCOUNT_NAME}
vietqr.template=${VIETQR_TEMPLATE}

# ============================================================
# TASK 7 - OTP qua Email: Thong tin Gmail SMTP (Doc tu .env)
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Base URL cua he thong (Doc tu .env)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ============================================================
# SEPAY WEBHOOK CONFIGURATION
# ============================================================
sepay.api-key=${SEPAY_API_KEY:}
sepay.admin-account-no=${SEPAY_ADMIN_ACCOUNT_NO:058888192005}
sepay.admin-bank-bin=${SEPAY_ADMIN_BANK_BIN:970422}
sepay.admin-bank-name=${SEPAY_ADMIN_BANK_NAME:MBBank}
sepay.booking-prefix=${SEPAY_BOOKING_PREFIX:BK}
