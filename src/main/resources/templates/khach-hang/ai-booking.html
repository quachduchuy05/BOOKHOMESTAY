<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{dung-chung/layout :: head('AI Booking Assistant - Homestay')}">
</head>

<body>
    <nav th:replace="~{dung-chung/layout :: navbar}"></nav>

    <style>
        .filter-container, .chat-container {
 height: 80vh;
 min-height: 680px;
        }
        @media (max-width: 991px) {
            .filter-container { height: auto; min-height: unset; max-height: 50vh; border-right: 0 !important; border-bottom: 1px solid var(--bhs-line); }
            .chat-container { height: 60vh; min-height: unset; }
        }
        .message-row { display: flex; margin-bottom: 20px; animation: fadeIn 0.3s ease-out forwards; }
        .message-row.user { justify-content: flex-end; }
        .bubble {
 max-width: 75%;
 padding: 12px 18px;
 font-size: 0.95rem;
 line-height: 1.5;
        }
        .user .bubble {
 background: var(--bhs-primary-gradient);
 color: white;
 box-shadow: var(--bhs-shadow-sm);
        }
        .ai .bubble {
 background: #f1f3f5;
 color: var(--bhs-ink);
        }
        @keyframes fadeIn {
 from { opacity: 0; transform: translateY(10px); }
 to { opacity: 1; transform: translateY(0); }
        }
        .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 15px 18px; }
        .dot { width: 8px; height: 8px; background: var(--bhs-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        ::placeholder { color: var(--bhs-subtle) !important; opacity: 1; }
        
        .chat-header-title {
 background: var(--bhs-primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        #inputGroupCustom:focus-within {
 border-color: var(--bhs-primary) !important;
 box-shadow: 0 0 0 3px rgba(255, 56, 92, 0.1);
        }
    </style>

    <div class="py-4" style="background-color: var(--bhs-bg);">
        <div class="container-fluid px-4">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb small">
                    <li class="breadcrumb-item"><a th:href="@{/}" class="text-decoration-none">Trang chủ</a></li>
                    <li class="breadcrumb-item active" aria-current="page">AI Booking Assistant</li>
                </ol>
            </nav>

            <div class="row g-0 bg-white shadow-sm" style="margin: 0 auto; border: 1px solid var(--bhs-line); overflow: hidden; width: 100%;">
                <!-- Manual Filter Panel -->
                <div class="col-lg-3 filter-container border-end" style="border-color: var(--bhs-line) !important;">
                    <div class="card-body overflow-auto p-4 pt-5 mt-3 d-flex flex-column">
                        <form id="manualFilterForm" class="d-flex flex-column h-100">
                            <div class="mb-2">
                                <label class="form-label small fw-bold text-secondary mb-1">Tỉnh/Thành phố</label>
                                <input type="text" id="filterProvinces" class="form-control form-control-sm" placeholder="Vd: Đà Lạt, Hà Nội">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold text-secondary mb-1">Quận/Huyện</label>
                                <input type="text" id="filterDistricts" class="form-control form-control-sm" placeholder="Vd: Hoàn Kiếm">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small fw-bold text-secondary mb-1">Thời gian lưu trú (Nhận - Trả phòng)</label>
                                <input type="text" id="filterDateRange" class="form-control form-control-sm bg-white" placeholder="Chọn ngày nhận và trả phòng" readonly style="cursor: pointer;">
                                <input type="hidden" id="filterCheckIn">
                                <input type="hidden" id="filterCheckOut">
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-secondary mb-1">Số người</label>
                                    <input type="number" id="filterGuest" class="form-control form-control-sm" min="1">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-secondary mb-1">Số phòng</label>
                                    <input type="number" id="filterRoom" class="form-control form-control-sm" min="1">
                                </div>
                            </div>
                            <div class="row mb-2">
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-secondary mb-1">Giá Min (VNĐ)</label>
                                    <input type="number" id="filterPriceMin" class="form-control form-control-sm" step="100000">
                                </div>
                                <div class="col-6">
                                    <label class="form-label small fw-bold text-secondary mb-1">Giá Max (VNĐ)</label>
                                    <input type="number" id="filterPriceMax" class="form-control form-control-sm" step="100000">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold text-secondary mb-1">Tiện ích</label>
                                <textarea id="filterAmenities" class="form-control form-control-sm" rows="2" placeholder="Vd: bể bơi, hồ bơi&#10;BBQ, nướng"></textarea>
                            </div>
                            <div class="mt-auto pt-2">
                                <button type="button" onclick="submitManualFilter()" class="btn btn-primary w-100">
                                    Áp dụng & Tìm kiếm lại
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="col-lg-9 chat-container d-flex flex-column border-end" style="background: var(--bhs-surface); border-color: var(--bhs-line) !important;">
                    <div class="p-3 bg-white border-bottom d-flex align-items-center justify-content-between shadow-sm z-3" style="border-color: var(--bhs-line) !important;">
                        <h5 class="fw-bold m-0 chat-header-title"><i class="fa-solid fa-robot me-2 text-primary"></i>AI Booking Assistant</h5>
                        <div></div>
                    </div>

                    <div class="flex-grow-1 p-4 overflow-auto" id="chatBox" style="scroll-behavior: smooth;">
                        <div class="message-row ai">
                            <div class="bubble">
 Chào bạn! 👋 Mình là trợ lý AI. Mình có thể giúp bạn tìm phòng homestay một cách nhanh chóng.
 Bạn muốn đi đâu, vào thời gian nào, đi bao nhiêu người và có yêu cầu gì đặc biệt không?
                                (VD: Mình muốn đi Đà Lạt 2 người, tuần sau, có hồ bơi)
                            </div>
                        </div>
                    </div>

                    <div class="p-3 bg-white border-top" style="border-color: var(--bhs-line) !important;">
                        <form id="chatForm" onsubmit="sendMessage(event)">
                            <div class="d-flex bg-light p-1 border align-items-center" id="inputGroupCustom" style="transition: all 0.3s ease;">
                                <input type="text" id="userInput" class="form-control border-0 bg-transparent shadow-none" placeholder="Nhập yêu cầu của bạn..." autocomplete="off" required>
                                <button type="submit" class="btn text-white d-flex align-items-center justify-content-center me-1" id="sendBtn" style="width: 45px; height: 45px; background: var(--bhs-primary-gradient); border: none; transition: transform 0.2s;">
                                    <i class="fa-solid fa-paper-plane"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>


            </div>
        </div>
    </div>

    <footer th:replace="~{dung-chung/layout :: footer}"></footer>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
        // Generate a simple session ID
 let sessionId = sessionStorage.getItem('aiSessionId');
 if (!sessionId) {
 sessionId = 'session_' + Math.random().toString(36).substr(2, 9);
 sessionStorage.setItem('aiSessionId', sessionId);
        }

 const chatBox = document.getElementById('chatBox');
 const userInput = document.getElementById('userInput');
 const sendBtn = document.getElementById('sendBtn');
 let isWaiting = false;

 let datePickerInstance = null;

 document.addEventListener('DOMContentLoaded', function () {
 datePickerInstance = flatpickr("#filterDateRange", {
 mode: "range",
 minDate: "today",
 dateFormat: "Y-m-d",
 onChange: function (selectedDates, dateStr, instance) {
 if (selectedDates.length === 2) {
 document.getElementById('filterCheckIn').value = flatpickr.formatDate(selectedDates[0], "Y-m-d");
 document.getElementById('filterCheckOut').value = flatpickr.formatDate(selectedDates[1], "Y-m-d");
                    } else if (selectedDates.length === 1) {
 document.getElementById('filterCheckIn').value = flatpickr.formatDate(selectedDates[0], "Y-m-d");
 document.getElementById('filterCheckOut').value = "";
                    } else {
 document.getElementById('filterCheckIn').value = "";
 document.getElementById('filterCheckOut').value = "";
                    }
                }
            });
        });

 function appendUserMessage(text) {
 const div = document.createElement('div');
 div.className = 'message-row user';
 div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
 chatBox.appendChild(div);
 scrollToBottom();
        }

 function appendAiMessage(htmlContent) {
 const div = document.createElement('div');
 div.className = 'message-row ai';
 div.innerHTML = `<div class="bubble">${htmlContent}</div>`;
 chatBox.appendChild(div);
 scrollToBottom();
        }

 function showTyping() {
 const div = document.createElement('div');
 div.className = 'message-row ai';
 div.id = 'typingIndicator';
 div.innerHTML = `
            <div class="bubble typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>`;
 chatBox.appendChild(div);
 scrollToBottom();
        }

 function removeTyping() {
 const indicator = document.getElementById('typingIndicator');
 if (indicator) indicator.remove();
        }

 function scrollToBottom() {
 chatBox.scrollTop = chatBox.scrollHeight;
        }

 function escapeHtml(unsafe) {
 return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

 function formatCurrency(amount) {
 return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(amount);
        }

 async function checkAndBook(roomId, checkIn, checkOut, roomCount) {
 try {
 let url = `/api/ai-booking/check-availability/${roomId}`;
 const params = new URLSearchParams();
 if (checkIn) params.append('checkIn', checkIn);
 if (checkOut) params.append('checkOut', checkOut);

 if (params.toString()) {
 url += '?' + params.toString();
                }

 const res = await fetch(url);
 const data = await res.json();

 if (data.available) {
                    // Redirect to checkout
 let redirectUrl = `/khach-hang/dat-phong/moi?roomId=${roomId}`;
 if (checkIn) redirectUrl += `&checkinDate=${checkIn}`;
 if (checkOut) redirectUrl += `&checkoutDate=${checkOut}`;
 if (roomCount) redirectUrl += `&roomCount=${roomCount}`;
 window.location.href = redirectUrl;
                } else {
 alert("Rất tiếc! Phòng này vừa được đặt hoặc không còn trống trong khoảng thời gian bạn chọn. Vui lòng chọn phòng khác.");
                }
            } catch (error) {
 alert("Có lỗi xảy ra khi kiểm tra phòng. Vui lòng thử lại!");
            }
        }

 function updateFilterUI(filters) {
 if (!filters) return;
 document.getElementById('filterProvinces').value = filters.provinces ? filters.provinces.join(', ') : '';
 document.getElementById('filterDistricts').value = filters.districts ? filters.districts.join(', ') : '';

 const checkIn = filters.checkInDate || '';
 const checkOut = filters.checkOutDate || '';
 document.getElementById('filterCheckIn').value = checkIn;
 document.getElementById('filterCheckOut').value = checkOut;

 if (datePickerInstance) {
 if (checkIn && checkOut) {
 datePickerInstance.setDate([checkIn, checkOut]);
                } else if (checkIn) {
 datePickerInstance.setDate([checkIn]);
                } else {
 datePickerInstance.clear();
                }
            }

 document.getElementById('filterGuest').value = filters.guestCount || '';
 document.getElementById('filterRoom').value = filters.roomCount || '';
 document.getElementById('filterPriceMin').value = filters.priceMin || '';
 document.getElementById('filterPriceMax').value = filters.priceMax || '';

 if (filters.amenityGroups) {
 document.getElementById('filterAmenities').value = filters.amenityGroups.map(g => g.join(', ')).join('\n');
            } else {
 document.getElementById('filterAmenities').value = '';
            }
        }

 function renderSuggestions(data) {
            // 1. Render system prompt
 if (data.systemPrompt) {
 appendAiMessage(data.systemPrompt);
            }

            // 2. Render suggestions
 if (data.suggestions && data.suggestions.length > 0) {
 let html = '<div class="mt-2">';
 data.suggestions.forEach(room => {
 html += `
                    <div class="room-card">
                        <div class="room-card-header d-flex justify-content-between align-items-center">
                            <span><i class="fa-solid fa-house-chimney text-primary me-2"></i>${escapeHtml(room.homestayName)}</span>
                            <span class="price">${formatCurrency(room.price)}/đêm</span>
                        </div>
                        <div class="room-card-body">
                            <h6 class="mb-2 fw-bold">${escapeHtml(room.roomName)}</h6>
                            <p class="small text-muted mb-2">
                                <i class="fa-solid fa-users me-1"></i> Đề xuất ${room.roomCount} phòng cho ${room.guestCount} người
                            </p>
                            ${room.matchedAmenities && room.matchedAmenities.length > 0 ?
                            `<div class="mb-3">
                                    ${room.matchedAmenities.map(a => `<span class="badge bg-light text-dark border me-1"><i class="fa-solid fa-check text-success me-1"></i>${escapeHtml(a)}</span>`).join('')}
                                 </div>` : ''}
                            
                            <div class="d-flex gap-2 mt-3">
                                <a href="javascript:void(0)" onclick="toggleHomestayDetails(${room.homestayId}, this)" class="btn btn-sm btn-outline-primary flex-grow-1 toggle-details-btn" data-id="${room.homestayId}">Xem chi tiết</a>
                                <button onclick="checkAndBook(${room.roomId}, '${room.checkInDate || ''}', '${room.checkOutDate || ''}', ${room.roomCount})" class="btn btn-sm btn-primary flex-grow-1">Đặt ngay</button>
                            </div>
                            
                            <!-- Inline Details Container -->
                            <div class="homestay-details-inline mt-3 d-none border-top pt-3">
                                <div class="text-center"><div class="spinner-border text-primary spinner-border-sm" role="status"></div></div>
                            </div>
                        </div>
                    </div>
                `;
                });
 html += '</div>';
 appendAiMessage(html);
            }
        }

 async function submitManualFilter() {
 if (isWaiting) return;

 const manualFilters = {
 provinces: document.getElementById('filterProvinces').value.split(',').map(s => s.trim()).filter(s => s),
 districts: document.getElementById('filterDistricts').value.split(',').map(s => s.trim()).filter(s => s),
 checkInDate: document.getElementById('filterCheckIn').value || null,
 checkOutDate: document.getElementById('filterCheckOut').value || null,
 guestCount: document.getElementById('filterGuest').value ? parseInt(document.getElementById('filterGuest').value) : null,
 roomCount: document.getElementById('filterRoom').value ? parseInt(document.getElementById('filterRoom').value) : null,
 priceMin: document.getElementById('filterPriceMin').value ? parseInt(document.getElementById('filterPriceMin').value) : null,
 priceMax: document.getElementById('filterPriceMax').value ? parseInt(document.getElementById('filterPriceMax').value) : null,
 amenityGroups: document.getElementById('filterAmenities').value.split('\n').filter(s => s.trim()).map(line => line.split(',').map(s => s.trim()).filter(s => s))
            };

 if (!manualFilters.provinces.length) manualFilters.provinces = null;
 if (!manualFilters.districts.length) manualFilters.districts = null;
 if (!manualFilters.amenityGroups.length) manualFilters.amenityGroups = null;

 isWaiting = true;
 showTyping();

 try {
 const response = await fetch('/api/ai-booking/manual-query?sessionId=' + encodeURIComponent(sessionId), {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify(manualFilters)
                });

 if (!response.ok) throw new Error('API Error');

 const data = await response.json();
 removeTyping();

 if (data.currentFilters) {
 updateFilterUI(data.currentFilters);
                }
 renderSuggestions(data);

            } catch (error) {
 removeTyping();
 appendAiMessage("Lỗi khi tìm kiếm với bộ lọc tùy chỉnh.");
            } finally {
 isWaiting = false;
            }
        }

 async function sendMessage(e) {
 e.preventDefault();
 if (isWaiting) return;

 const text = userInput.value.trim();
 if (!text) return;

 appendUserMessage(text);
 userInput.value = '';
 isWaiting = true;
 sendBtn.disabled = true;
 showTyping();

 try {
 const response = await fetch('/api/ai-booking/chat', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ sessionId, message: text })
                });

 if (!response.ok) throw new Error('API Error');

 const data = await response.json();

                // Update filter UI
 if (data.currentFilters) {
 updateFilterUI(data.currentFilters);
                }

 removeTyping();

 renderSuggestions(data);

            } catch (error) {
 removeTyping();
 appendAiMessage("Xin lỗi, hệ thống AI đang gặp chút sự cố. Bạn vui lòng thử lại sau nhé.");
            } finally {
                isWaiting = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        async function toggleHomestayDetails(homestayId, btnElement) {
            const cardBody = btnElement.closest('.room-card-body');
            const detailsContainer = cardBody.querySelector('.homestay-details-inline');
            
            if (detailsContainer.classList.contains('d-none')) {
                // Đóng tất cả các panel khác đang mở
                document.querySelectorAll('.homestay-details-inline:not(.d-none)').forEach(panel => {
                    if (panel !== detailsContainer) {
                        panel.classList.add('d-none');
                        const toggleBtn = panel.closest('.room-card-body').querySelector('.toggle-details-btn');
                        if (toggleBtn) toggleBtn.innerHTML = 'Xem chi tiết';
                    }
                });

                // Mở ra
                detailsContainer.classList.remove('d-none');
                btnElement.innerHTML = 'Đóng lại';
                
                if (!detailsContainer.hasAttribute('data-loaded')) {
                    try {
                        const res = await fetch(`/api/ai-booking/homestay/${homestayId}`);
                        if (!res.ok) throw new Error('Cannot fetch homestay');
                        const data = await res.json();
                        
                        let amenitiesHtml = data.amenities.map(a => `<span class="badge bg-light text-dark border mb-1 me-1"><i class="fa-solid fa-check text-success me-1"></i>${escapeHtml(a)}</span>`).join('');
                        let imgHtml = data.thumbnail ? `<img src="${data.thumbnail}" class="img-fluid rounded mb-2 w-100" style="max-height: 200px; object-fit: cover;" alt="Thumbnail">` : ``;
                        
                        detailsContainer.innerHTML = `
                            ${imgHtml}
                            <h6 class="fw-bold mt-2 text-primary">Chi tiết ${escapeHtml(data.name)}</h6>
                            <p class="small text-muted mb-2"><i class="fa-solid fa-location-dot me-1 text-danger"></i> ${escapeHtml(data.address)}</p>
                            <p class="small text-muted mb-2" style="white-space: pre-line; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;">${escapeHtml(data.intro)}</p>
                            <h6 class="fw-bold mt-3 mb-1">Tiện nghi</h6>
                            <div class="mb-3">${amenitiesHtml}</div>
                            <a href="/homestay/${data.slug}" target="_blank" class="btn btn-sm btn-outline-info w-100">Xem đầy đủ trang Homestay</a>
                        `;
                        detailsContainer.setAttribute('data-loaded', 'true');
                    } catch (e) {
                        detailsContainer.innerHTML = '<div class="text-center text-danger small">Lỗi khi tải chi tiết.</div>';
                    }
                }
            } else {
                // Đóng lại
                detailsContainer.classList.add('d-none');
                btnElement.innerHTML = 'Xem chi tiết';
            }
        }
    </script>

</body>

</html>
