<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{dung-chung/layout :: head('Mã giảm giá')}"></head>
<body>
<nav th:replace="~{dung-chung/layout :: navbar}"></nav>
<div class="container mt-4" style="max-width:600px;">
    <h3 th:text="${promotionForm.id} ? 'Sửa mã giảm giá' : 'Tạo mã giảm giá mới'">Mã giảm giá</h3>
    <form th:action="@{/quan-tri/ma-giam-gia/luu}" th:object="${promotionForm}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-2"><label>Mã (VD: SUMMER2026)</label><input class="form-control text-uppercase" th:field="*{code}" required></div>
        <div class="mb-2">
            <label>Loại giảm giá</label>
            <select class="form-select" th:field="*{discountType}">
                <option value="PERCENTAGE">Phần trăm (%)</option>
                <option value="FIXED">Số tiền cố định (VNĐ)</option>
            </select>
        </div>
        <div class="mb-2"><label>Giá trị giảm</label><input type="number" step="0.01" class="form-control" th:field="*{discountValue}" required></div>
        <div class="mb-2"><label>Giảm tối đa (VNĐ, để trống nếu không giới hạn — chỉ áp dụng cho loại %)</label><input type="number" class="form-control" th:field="*{maxDiscountAmount}"></div>
        <div class="mb-2"><label>Giá trị đơn tối thiểu để áp mã (VNĐ)</label><input type="number" class="form-control" th:field="*{minOrderAmount}"></div>
        <div class="row">
            <div class="col mb-2"><label>Ngày bắt đầu</label><input type="date" class="form-control" th:field="*{startDate}" required></div>
            <div class="col mb-2"><label>Ngày kết thúc</label><input type="date" class="form-control" th:field="*{endDate}" required></div>
        </div>
        <div class="mb-3"><label>Giới hạn lượt dùng (0 = không giới hạn)</label><input type="number" class="form-control" th:field="*{usageLimit}"></div>
        <button class="btn btn-tv w-100" type="submit">Lưu mã giảm giá</button>
    </form>
</div>
<div th:replace="~{dung-chung/layout :: footer}"></div>
</body>
</html>
