<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{dung-chung/layout :: head('Quản lý Phòng Homestay')}"></head>
<body>
<nav th:replace="~{dung-chung/layout :: navbar}"></nav>

<div class="container-fluid px-lg-4 py-4">
    <!-- Mobile Sidebar Trigger -->
    <div th:replace="~{dung-chung/admin-sidebar :: toggle}"></div>

    <div class="row g-4">
        <!-- Admin Slidebar (Sidebar) -->
        <div th:replace="~{dung-chung/admin-sidebar :: sidebar('phong')}"></div>
        <div th:replace="~{dung-chung/admin-sidebar :: offcanvas('phong')}"></div>

        <!-- Main Content Column -->
        <div class="col-lg-9 col-xl-10">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
                <div>
                    <h3 class="fw-bold m-0 text-dark"><i class="fa-solid fa-bed text-primary me-2"></i>Quản Lý Phòng Trong Hệ Thống</h3>
                    <p class="text-muted small m-0 mt-1">Admin có toàn quyền can thiệp điều chỉnh giá niêm yết hoặc trạng thái phòng cho thuê.</p>
                </div>
                <span class="badge bg-primary-subtle text-primary px-3 py-2 fw-semibold rounded-pill">
                    <span th:text="${rooms.size()}">0</span> phòng
                </span>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light text-secondary small">
                            <tr>
                                <th>Homestay</th>
                                <th>Chủ nhà</th>
                                <th>Tên phòng</th>
                                <th>Giá / đêm</th>
                                <th>Số khách</th>
                                <th>Tình trạng</th>
                                <th class="text-end" style="width: 220px;">Hành động</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${rooms}">
                                <td class="fw-bold text-dark" th:text="${r.homestay.name}">Homestay</td>
                                <td class="small text-muted" th:text="${r.homestay.host.businessName}">Chủ nhà</td>
                                <td class="fw-semibold text-dark" th:text="${r.name}">Deluxe Double</td>
                                <td>
                                    <span class="fw-bold text-danger" th:text="${#numbers.formatDecimal(r.pricePerNight,0,'POINT',0,'COMMA')} + ' đ'">850,000 đ</span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border">
                                        <i class="fa-solid fa-user-group me-1 text-primary"></i><span th:text="${r.maxGuests}">2</span>
                                    </span>
                                </td>
                                <td>
                                    <span class="badge rounded-pill px-3 py-1 fw-semibold"
                                          th:classappend="${r.status.name() == 'ACTIVE'} ? 'bg-success-subtle text-success' : 'bg-secondary-subtle text-secondary'"
                                          th:text="${r.status.name() == 'ACTIVE'} ? 'Còn phòng' : 'Hết phòng'">Còn phòng</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/quan-tri/phong/{id}/sua(id=${r.id})}" class="btn btn-sm btn-outline-primary rounded-pill px-3 fw-semibold">
                                            <i class="fa-solid fa-pen me-1"></i>Sửa giá
                                        </a>
                                        <form th:action="@{/quan-tri/phong/{id}/doi-trang-thai(id=${r.id})}" method="post" class="d-inline">
                                            <button class="btn btn-sm btn-light border rounded-pill px-2 fw-semibold"
                                                    th:title="${r.status.name() == 'ACTIVE'} ? 'Chuyển sang Hết phòng' : 'Chuyển sang Còn phòng'">
                                                <i class="fa-solid" th:classappend="${r.status.name() == 'ACTIVE'} ? 'fa-toggle-on text-success' : 'fa-toggle-off text-muted'"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${rooms.isEmpty()}">
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <i class="fa-regular fa-folder-open display-6 mb-2 d-block text-secondary"></i>
                                    <p class="m-0">Chưa có phòng nào được tạo trên hệ thống.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{dung-chung/layout :: footer}"></div>
</body>
</html>
