<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{dung-chung/layout :: head('Người dùng hệ thống')}"></head>
<body>
<nav th:replace="~{dung-chung/layout :: navbar}"></nav>
<div class="container mt-4">
    <h3 class="mb-4"><i class="fa-solid fa-users-gear me-2"></i>Danh sách người dùng theo vai trò</h3>
    <p class="text-muted">
        Phân biệt rõ 3 nhóm quan hệ nghiệp vụ: <b>Quản trị viên</b> (vận hành hệ thống),
        <b>Chủ nhà / Cộng tác viên</b> (bên cung cấp - bán phòng), và <b>Khách hàng</b> (bên mua - đặt phòng).
    </p>

    <div class="accordion" id="accordionVaiTro">
        <div class="accordion-item" th:each="entry, iter : ${nguoiDungTheoVaiTro}">
            <h2 class="accordion-header">
                <button class="accordion-button" th:classappend="${iter.index != 0} ? 'collapsed'" type="button"
                        data-bs-toggle="collapse" th:data-bs-target="'#nhom' + ${iter.index}">
                    <span th:text="${entry.key}">Vai trò</span>
                    <span class="badge bg-secondary ms-2" th:text="${entry.value.size()}">0</span>
                </button>
            </h2>
            <div th:id="'nhom' + ${iter.index}" class="accordion-collapse collapse"
                 th:classappend="${iter.index == 0} ? 'show'" data-bs-parent="#accordionVaiTro">
                <div class="accordion-body p-0">
                    <table class="table mb-0">
                        <thead><tr><th>#</th><th>Họ tên</th><th>Email</th><th>Điện thoại</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
                        <tbody>
                        <tr th:each="u, i : ${entry.value}">
                            <td th:text="${i.count}">1</td>
                            <td th:text="${u.fullName}">Tên</td>
                            <td th:text="${u.email}">email</td>
                            <td th:text="${u.phone}">sđt</td>
                            <td><span class="badge" th:classappend="${u.status.name() == 'BLOCKED'} ? 'bg-danger' : 'bg-success'" th:text="${u.status}"></span></td>
                            <td>
                                <form th:action="@{/quan-tri/nguoi-dung/{id}/khoa-mo(id=${u.id})}" method="post"
                                      th:onsubmit="return confirm('Xác nhận thay đổi trạng thái tài khoản này?')">
                                    <button class="btn btn-sm" th:classappend="${u.status.name() == 'BLOCKED'} ? 'btn-outline-success' : 'btn-outline-danger'"
                                            th:text="${u.status.name() == 'BLOCKED'} ? 'Mở khoá' : 'Khoá'">Khoá</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${entry.value.isEmpty()}"><td colspan="6" class="text-muted text-center py-3">Chưa có ai</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{dung-chung/layout :: footer}"></div>
</body>
</html>
