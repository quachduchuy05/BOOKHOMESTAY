<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{dung-chung/layout :: head('Duyệt Cộng tác viên')}"></head>
<body>
<nav th:replace="~{dung-chung/layout :: navbar}"></nav>
<div class="container mt-4">
    <h3 class="mb-3"><i class="fa-solid fa-user-tag me-2"></i>Xác nhận đăng ký Cộng tác viên</h3>
    <p class="text-muted small">Duyệt để xác nhận đây thực sự là Cộng tác viên/Sale, phân biệt rõ với Chủ nhà cho thuê (xem trang "Duyệt chủ nhà" riêng).</p>
    <table class="table bg-white align-middle">
        <thead><tr><th>Họ tên</th><th>Email</th><th>Mã giới thiệu</th><th>Ngân hàng</th><th>Số TK nhận hoa hồng</th><th>Hành động</th></tr></thead>
        <tbody>
        <tr th:each="c : ${collaborators}">
            <td th:text="${c.user.fullName}">Tên</td>
            <td th:text="${c.user.email}">email</td>
            <td><code th:text="${c.maGioiThieu}">CTV-XXXX</code></td>
            <td th:text="${c.tenNganHang}">Ngân hàng</td>
            <td th:text="${c.soTaiKhoanNhanHoaHong}">STK</td>
            <td class="d-flex gap-1">
                <form th:action="@{/quan-tri/cong-tac-vien/{id}/duyet(id=${c.id})}" method="post">
                    <button class="btn btn-sm btn-success">Duyệt</button>
                </form>
                <form th:action="@{/quan-tri/cong-tac-vien/{id}/tu-choi(id=${c.id})}" method="post">
                    <button class="btn btn-sm btn-outline-danger">Từ chối</button>
                </form>
            </td>
        </tr>
        <tr th:if="${collaborators.isEmpty()}"><td colspan="6" class="text-center text-muted py-3">Không có yêu cầu nào đang chờ.</td></tr>
        </tbody>
    </table>
</div>
<div th:replace="~{dung-chung/layout :: footer}"></div>
</body>
</html>
